<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Business Name</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
        }

        header {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 60px 0;
        }

        .service-item {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 60px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            color: #7289da;
            margin-top: 40px;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 50px;
        }

        .social-link {
            color: #7289da;
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Your Business Name</h1>
            <div class="logo">LOGO</div>
        </header>

        <section class="services">
            <h2>Our Services</h2>
            <div class="service-item">
                <i class="fas fa-rocket icon"></i>
                <h3>Service 1</h3>
                <p>Describe what your first service offers here.</p>
            </div>
            <div class="service-item">
                <i class="fas fa-shield-alt icon"></i>
                <h3>Service 2</h3>
                <p>Describe what your second service offers here.</p>
            </div>
            <div class="service-item">
                <i class="fas fa-clock icon"></i>
                <h3>Service 3</h3>
                <p>Describe what your third service offers here.</p>
            </div>
        </section>

        <div class="contact-form">
            <input type="text" placeholder="Your Name" autocomplete="off" value="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea rows="4" placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </div>

        <footer>
            <p>Made with care • [Your Business Name]</p>
        </footer>

        <div class="social-links">
            <a href="#" class="social-link"><i class="fab fa-facebook"></i></a>
            <a href="#" class="social-link"><i class="fab fa-twitter"></i></a>
            <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
        </div>
    </div>
</body>
</html>
